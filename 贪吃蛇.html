<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #1a1a2e;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e9e9f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    text-align: center;
    user-select: none;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 14px;
    color: #4ade80;
    text-shadow: 0 0 12px rgba(74,222,128,.4);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 16px;
  }
  .hud .label { opacity: .7; margin-right: 6px; }
  .hud .val { font-weight: 700; font-size: 18px; color: #fde047; }
  .board-box {
    position: relative;
    display: inline-block;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    background: #16213e;
  }
  canvas { display: block; background: #16213e; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,18,40,.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 30px; color: #fff; letter-spacing: 2px; }
  .overlay p { font-size: 14px; opacity: .85; line-height: 1.7; max-width: 320px; }
  .overlay .big { font-size: 22px; color: #fde047; font-weight: 700; }
  .btn {
    margin-top: 6px;
    padding: 11px 30px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #16213e;
    background: #4ade80;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .2s ease;
    box-shadow: 0 6px 18px rgba(74,222,128,.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 9px 22px rgba(74,222,128,.5); }
  .btn:active { transform: translateY(0); }
  .tips {
    margin-top: 14px;
    font-size: 13px;
    opacity: .6;
    line-height: 1.8;
  }
  .tips kbd {
    background: #2c2f4a;
    border: 1px solid #44486a;
    border-radius: 5px;
    padding: 1px 7px;
    font-family: inherit;
    margin: 0 1px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>贪 吃 蛇</h1>
    <div class="hud">
      <div><span class="label">得分</span><span class="val" id="score">0</span></div>
      <div><span class="label">最高</span><span class="val" id="best">0</span></div>
    </div>
    <div class="board-box">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">准备好了吗？</h2>
        <p id="ovText">用 <b>方向键</b> 或 <b>WASD</b> 控制蛇的移动<br>吃到食物得分，撞墙或撞到自己就结束</p>
        <button class="btn" id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="tips">
      移动：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>　|　暂停：<kbd>空格</kbd>　|　重开：<kbd>回车</kbd>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovText = document.getElementById("ovText");
  var startBtn = document.getElementById("startBtn");

  var GRID = 20;                       // 网格数
  var CELL = canvas.width / GRID;      // 每格像素
  var STEP_MS = 110;                   // 蛇移动间隔（毫秒）

  var snake, dir, nextDir, food, score, best, running, paused, timer;

  best = parseInt(localStorage.getItem("snake_best") || "0", 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = "0";
    placeFood();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        var hit = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { hit = true; break; }
        }
        if (!hit) free.push({ x: x, y: y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  function draw() {
    // 背景
    ctx.fillStyle = "#16213e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线（淡）
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 食物
    drawCell(food.x, food.y, "#f87171", true);

    // 蛇
    for (var s = 0; s < snake.length; s++) {
      var isHead = s === 0;
      drawCell(snake[s].x, snake[s].y, isHead ? "#4ade80" : "#22c55e", false);
      if (isHead) {
        // 眼睛
        ctx.fillStyle = "#16213e";
        var cx = snake[s].x * CELL, cy = snake[s].y * CELL;
        var ex = cx + CELL / 2, ey = cy + CELL / 2;
        var r = CELL / 9;
        var ox = dir.x * CELL / 4, oy = dir.y * CELL / 4;
        var px = -dir.y * CELL / 5, py = dir.x * CELL / 5;
        ctx.beginPath(); ctx.arc(ex + ox + px, ey + oy + py, r, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + ox - px, ey + oy - py, r, 0, 7); ctx.fill();
      }
    }
  }

  function drawCell(gx, gy, color, round) {
    var pad = 1.5;
    var x = gx * CELL + pad, y = gy * CELL + pad;
    var w = CELL - pad * 2, h = CELL - pad * 2;
    ctx.fillStyle = color;
    if (round) {
      ctx.beginPath();
      ctx.arc(gx * CELL + CELL / 2, gy * CELL + CELL / 2, CELL / 2 - pad, 0, 7);
      ctx.fill();
    } else {
      roundRect(x, y, w, h, 5);
      ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) {
      return gameOver();
    }
    // 撞自己
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("snake_best", String(best));
      }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function loop() {
    if (running && !paused) step();
  }

  function startGame() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add("hidden");
    clearInterval(timer);
    timer = setInterval(loop, STEP_MS);
    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    ovTitle.textContent = "游戏结束";
    ovText.innerHTML = '本局得分 <span class="big">' + score + '</span><br>按 <b>回车</b> 或点击按钮再来一局';
    startBtn.textContent = "再来一局";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = "已暂停";
      ovText.innerHTML = "按 <b>空格</b> 继续游戏";
      startBtn.textContent = "继续";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
    }
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(e.key.toLowerCase()) !== -1) {
      e.preventDefault();
    }
    if (k === "arrowup" || k === "w") {
      if (dir.y !== 1) nextDir = { x: 0, y: -1 };
    } else if (k === "arrowdown" || k === "s") {
      if (dir.y !== -1) nextDir = { x: 0, y: 1 };
    } else if (k === "arrowleft" || k === "a") {
      if (dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else if (k === "arrowright" || k === "d") {
      if (dir.x !== -1) nextDir = { x: 1, y: 0 };
    } else if (k === " ") {
      if (running) togglePause();
    } else if (k === "enter") {
      if (!running) startGame();
    }
  });

  startBtn.addEventListener("click", function () {
    if (paused && running) { togglePause(); }
    else { startGame(); }
  });

  // 初始绘制一帧
  reset();
  draw();
})();
</script>
</body>
</html>
